services:
  promptlab:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: promptlab-academy:latest
    container_name: promptlab-academy
    ports:
      - "8080:8080"
    environment:
      # Mac/Windows Docker Desktop: host.docker.internal apunta al Mac
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:3b
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
